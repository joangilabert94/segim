<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f7f1" />
    <meta name="description" content="Rutinas, series, pesos y repeticiones de tu día a día en el gimnasio. Funciona sin conexión." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>GymRutinas</title>
    <script>
      /* Tema ANTES del primer pintado: evita el destello del tema equivocado
         mientras se cargan los datos desde IndexedDB. Mismo criterio que
         src/theme.ts → src/services/theme.ts (claro si no se puede detectar). */
      (function () {
        try {
          var mode = localStorage.getItem('segim-theme');
          if (mode !== 'light' && mode !== 'dark') mode = 'auto';
          var theme;
          if (mode === 'light' || mode === 'dark') {
            theme = mode;
          } else {
            var prefers = null;
            if (window.matchMedia) {
              var mq = window.matchMedia('(prefers-color-scheme: light)');
              if (mq.media !== 'not all') prefers = mq.matches;
            }
            theme = prefers === false ? 'dark' : 'light';
          }
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.style.setProperty('color-scheme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0c0f0e' : '#f4f7f1');
          var ios = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (ios) ios.setAttribute('content', theme === 'dark' ? 'black-translucent' : 'default');
        } catch (e) {
          /* sin localStorage seguimos con el tema claro (el de por defecto) */
        }
      })();
    </script>
    <style>
      /* Pantalla de arranque mientras carga el módulo principal */
      html {
        --splash-bg: #f4f7f1;
        --splash-ink: #141a14;
      }
      html[data-theme='dark'] {
        --splash-bg: #0c0f0e;
        --splash-ink: #c6f24e;
      }
      html,
      body {
        margin: 0;
        background: var(--splash-bg);
        color: var(--splash-ink);
        font-family: system-ui, sans-serif;
      }
      #app {
        min-height: 100vh;
        display: grid;
        /* Pista fija: el ancho de la app nunca puede superar el viewport
           (sin esto, la pista auto se inflaba al ancho mínimo del contenido
           y en móviles estrechos aparecía scroll horizontal). */
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
      }
      .splash {
        text-align: center;
        letter-spacing: 0.2em;
        font-size: 14px;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .splash b {
        display: block;
        font-size: 40px;
        margin-bottom: 8px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="splash"><b>🏋️</b>GymRutinas</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
