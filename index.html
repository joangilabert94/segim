<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4f7f1" />
    <meta name="description" content="Rutinas, series, pesos y repeticiones de tu día a día en el gimnasio. Funciona sin conexión." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>Segim</title>
    <script>
      /* Antes del primer pintado para evitar el destello; mismo criterio que src/services/theme.ts y
         la misma tabla de paletas que src/services/palette.ts (mantener sincronizados). */
      (function () {
        try {
          var BAR = {
            salvia: '#f4f7f1', oceano: '#f0f5fa', arcilla: '#faf3ec',
            lima: '#0c0f0e', medianoche: '#0d1420', ambar: '#141010',
          };
          var LIGHT = ['salvia', 'oceano', 'arcilla'];
          var DARK = ['lima', 'medianoche', 'ambar'];
          var palettes = { light: 'salvia', dark: 'lima' };
          try {
            var raw = localStorage.getItem('segim-palettes');
            var parsed = raw ? JSON.parse(raw) : null;
            if (parsed && LIGHT.indexOf(parsed.light) !== -1) palettes.light = parsed.light;
            if (parsed && DARK.indexOf(parsed.dark) !== -1) palettes.dark = parsed.dark;
          } catch (e) { /* sin caché válida: valores por defecto */ }
          var mode = localStorage.getItem('segim-theme');
          if (mode !== 'light' && mode !== 'dark') mode = 'auto';
          var theme;
          if (mode === 'light' || mode === 'dark') {
            theme = mode;
          } else {
            var prefers = null;
            if (window.matchMedia) {
              var mq = window.matchMedia('(prefers-color-scheme: light)');
              if (mq.media !== 'not all') prefers = mq.matches;
            }
            theme = prefers === false ? 'dark' : 'light';
          }
          var palette = theme === 'light' ? palettes.light : palettes.dark;
          var root = document.documentElement;
          root.setAttribute('data-theme', theme);
          root.setAttribute('data-palette', palette);
          root.style.setProperty('color-scheme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', BAR[palette]);
          var ios = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
          if (ios) ios.setAttribute('content', theme === 'dark' ? 'black-translucent' : 'default');
        } catch (e) {
          /* sin localStorage seguimos con el tema claro (el de por defecto) */
        }
      })();
    </script>
    <style>
      html {
        --splash-bg: #f4f7f1;
        --splash-ink: #141a14;
      }
      html[data-palette='oceano'] {
        --splash-bg: #f0f5fa;
        --splash-ink: #0e5aa8;
      }
      html[data-palette='arcilla'] {
        --splash-bg: #faf3ec;
        --splash-ink: #b0441c;
      }
      html[data-theme='dark'] {
        --splash-bg: #0c0f0e;
        --splash-ink: #c6f24e;
      }
      html[data-palette='medianoche'] {
        --splash-bg: #0d1420;
        --splash-ink: #7dd3fc;
      }
      html[data-palette='ambar'] {
        --splash-bg: #141010;
        --splash-ink: #f2b33d;
      }
      html,
      body {
        margin: 0;
        background: var(--splash-bg);
        color: var(--splash-ink);
        font-family: system-ui, sans-serif;
      }
      #app {
        min-height: 100vh;
        display: grid;
        /* Sin minmax(0, …) la pista se infla al ancho mínimo del contenido: scroll horizontal en móvil. */
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
      }
      .splash {
        text-align: center;
        letter-spacing: 0.2em;
        font-size: 14px;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .splash b {
        display: block;
        font-size: 40px;
        margin-bottom: 8px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="splash"><b>🏋️</b>Segim</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
