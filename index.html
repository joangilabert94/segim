<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c0f0e" />
    <meta name="description" content="Rutinas, series, pesos y repeticiones de tu día a día en el gimnasio. Funciona sin conexión." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <title>GymRutinas</title>
    <style>
      /* Pantalla de arranque mientras carga el módulo principal */
      html,
      body {
        margin: 0;
        background: #0c0f0e;
        color: #c6f24e;
        font-family: system-ui, sans-serif;
      }
      #app {
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      .splash {
        text-align: center;
        letter-spacing: 0.2em;
        font-size: 14px;
        text-transform: uppercase;
        opacity: 0.8;
      }
      .splash b {
        display: block;
        font-size: 40px;
        margin-bottom: 8px;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="splash"><b>🏋️</b>GymRutinas</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
