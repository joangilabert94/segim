name: Desplegar en GitHub Pages

# ⚠️ Solo se despliega cuando se sube una ETIQUETA DE VERSIÓN (v1.2.3).
# Los pushes a master o a cualquier otra rama NO publican nada: sirven para
# subir trabajo en curso sin desplegarlo (la validación la hace ci.yml).
# `workflow_dispatch` queda como escape para publicar a mano desde Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        # BASE_PATH: subcarpeta del repositorio en GitHub Pages.
        # Si el repo es "usuario.github.io", usa BASE_PATH=/ directamente.
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
